name: Build and deploy Node.js app to Azure Web App - maxiumdoors

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Verify build output
        run: |
          pwd
          ls -la
          find dist -maxdepth 3 -type f

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: .

      - name: Inspect downloaded files
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2B3968A1677146E48A63083965AFCEC2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_28EBAB67FC164E9A8F46C0CB379878A2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E0FB67353BD541A1A3E4C5A1AAF2DA33 }}

      - name: Deploy static files
        uses: azure/webapps-deploy@v3
        with:
          app-name: maxiumdoors
          slot-name: Production
          package: .